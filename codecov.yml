---
codecov:
  notify:
    require_ci_to_pass: true
coverage:
  precision: 2
  round: down
  range: 50...100
  status:
    patch:
      default:
        target: 75%
    project:
      default:
        target: 85%
ignore:
  # Runs on the JAX backend only; the coverage job uses the NumPy backend,
  # under which all of its cases are skipped.
  - src_mettsim/tests_middle_earth/test_jittability.py
