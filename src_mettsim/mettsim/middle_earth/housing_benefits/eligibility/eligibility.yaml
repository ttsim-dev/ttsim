---
subsistence_income_level:
  name:
    de: Anspruchsvoraussetzung Einkommen pro Partner/Person
    en: Eligibility income per spouse/person
  description:
    de: Dict, da es sich über die Jahre ändert, aber der Paramtername gleich bleibt.
    en: Dict, because it changes over time, but the parameter name remains the same.
  type: dict
  1900-01-01:
    unit: SILVER_PENNY_PER_MONTH
    per_spouse: 500.0
  2020-01-01:
    note: >-
      Re-legislated per individual at the currency reform of 2020;
      denominated in castar (125 castar = 500 silver pennies).
    unit: CASTAR_PER_MONTH
    per_individual: 125.0
max_number_of_family_members:
  name:
