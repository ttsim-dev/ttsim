---
wealth_threshold_for_reduced_tax_rate:
  name:
    de: Vermögensschwelle, bis zu der der niedrigere Steuersatz gilt
    en: Wealth threshold below which the lower tax rate applies
  description:
    de: Umgekehrte Bennenung schiene sinnvoll.
    en: The reverse naming would seem more sensible.
  unit: SILVER_PENNY
  reference_level: fam
  type: scalar
  1900-01-01:
    value: 50000
  2020-01-01:
    note: >-
      Pure redenomination at the currency reform of 2020: the realm's unit of
      account switches from the Shire's silver penny to Gondor's castar
      (1 castar = 4 silver pennies).
    unit: CASTAR
    value: 12500
tax_schedule_standard:
  name:
    de: Standard Lohnsteuersatz
    en: Standard payroll tax schedule
  description:
    de: Für Angehörige von Familien mit niedrigem Vermögen
    en: For member of families with low wealth
  input_unit: SILVER_PENNY_FLOW
  output_unit: SILVER_PENNY_FLOW
  reference_period: Year
  type: piecewise_linear
  1900-01-01:
    intervals:
      - interval: (-inf, 0)
        slope: 0.0
        intercept: 0
      - interval: '[0, 100)'
        slope: 0.1
      - interval: '[100, inf)'
        slope: 0.3
  2020-01-01:
    note: >-
      Pure redenomination at the currency reform of 2020: bracket bounds are
      re-expressed in castar (1 castar = 4 silver pennies); the rates are
      dimensionless and carry over.
    input_unit: CASTAR_FLOW
    output_unit: CASTAR_FLOW
    intervals:
      - interval: (-inf, 0)
        slope: 0.0
        intercept: 0
      - interval: '[0, 25)'
        slope: 0.1
      - interval: '[25, inf)'
        slope: 0.3
tax_schedule_reduced:
  name:
    de: Lohnsteuersatz
    en: Payroll tax schedule
  description:
    de: Für Angehörige von Familien mit hohem Vermögen
    en: For member of families with high wealth
  input_unit: SILVER_PENNY_FLOW
  output_unit: SILVER_PENNY_FLOW
  reference_period: Year
  type: piecewise_linear
  1900-01-01:
    intervals:
      - interval: (-inf, 0)
        slope: 0
        intercept: 0
      - interval: '[0, 100)'
        slope: 0.1
      - interval: '[100, inf)'
        slope: 0.15
