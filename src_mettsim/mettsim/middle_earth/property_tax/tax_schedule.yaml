---
tax_schedule:
  name:
    de: Vermögenssteuer auf Landbesitz
    en: Wealth tax on land
  description:
    de: >-
      Vermögenssteuer auf Landbesitz. Bemisst sich an Größe des landwirtschaftlich
      nutzbaren Landes in Hektar.
    en: Wealth tax on land. Depends on size of arable land in hectares.
  input_unit: HECTARE
  output_unit: SILVER_PENNY_PER_YEAR
  type: piecewise_constant
  1900-01-01:
    intervals:
      - interval: (-inf, 10)
        intercept: 0
      - interval: '[10, 100)'
        intercept: 1000
      - interval: '[100, inf)'
        intercept: 10000
  2020-01-01:
    output_unit: CASTAR_PER_YEAR
    intervals:
      - interval: (-inf, 10)
        intercept: 0
      - interval: '[10, 100)'
        intercept: 250
      - interval: '[100, inf)'
        intercept: 2500
